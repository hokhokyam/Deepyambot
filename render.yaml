services:
  - type: web
    name: coarena-telegram-video-bot
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: COARENA_API_KEY
        sync: false
      - key: COARENA_MODEL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true

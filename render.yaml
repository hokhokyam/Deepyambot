
services:
  - type: web
    name: deepyam-ai-video
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: COARENA_API_KEY
        sync: false

      - key: COARENA_MODEL
        value: deepseek-chat

      - key: COARENA_BASE_URL
        value: https://coarena.ai/api/v1

      - key: WEBHOOK_SECRET
        generateValue: true
